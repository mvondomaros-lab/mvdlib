name: Test compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  base:
    name: Base installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the base package and test runner
        run: python -m pip install ".[test]"
      - name: Verify the base package imports without optional features
        run: python -c "import mvdlib"
  test:
    name: Python ${{ matrix.python }} (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            stack: NumPy 2.3 / Numba 0.62
            constraints: "numpy==2.3.5 numba==0.62.1 scipy==1.16.3"
          - python: "3.12"
            stack: current compatible dependencies
            constraints: ""
          - python: "3.14"
            stack: current compatible dependencies
            constraints: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install MVDLib and its diffusion test dependencies
        run: >-
          python -m pip install
          ".[plots,diffusion,test]"
          ${{ matrix.constraints }}
      - name: Run test suite
        run: python -m pytest -q
