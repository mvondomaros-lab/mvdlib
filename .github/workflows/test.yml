name: Test compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }} (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            stack: minimum supported dependencies
            constraints: "numpy==2.2.6 matplotlib==3.10.6 scipy==1.16.1"
          - python: "3.12"
            stack: current compatible dependencies
            constraints: ""
          - python: "3.14"
            stack: current compatible dependencies
            constraints: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install MVDLib and its test dependencies
        run: >-
          python -m pip install
          ".[test]"
          ${{ matrix.constraints }}
      - name: Run test suite
        run: python -m pytest -q
