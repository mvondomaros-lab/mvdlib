[project]
name = "mvdlib"
version = "0.22.0"
authors = [{ name = "Michael von Domaros", email = "mvondomaros@uni-marburg.de" }]
description = "The lab's Matplotlib plotting style and plotting helpers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.6",
    "numpy>=2.2.6",
    "scipy>=1.16.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mvdlib"]
include = ["mvdlib/style/*.mplstyle", "mvdlib/style/fonts/*"]

[tool.hatch.build.targets.sdist]
include = ["mvdlib",
    "README.md",
    "LICENSE"]

[tool.pixi.workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64"]
preview = ["pixi-build"]

[tool.pixi.dependencies]
hatch = "<2"
matplotlib = ">=3.10.6"
numpy = ">=2.2.6"
pixi-pycharm = "*"
pytest = ">=8"
scipy = ">=1.16.1"
markdown = ">=3.11.3,<4"

[tool.pixi.pypi-dependencies]
mvdlib = { path = ".", editable = true }

[tool.pixi.tasks]
gallery = { cmd = "python docs/gallery.py" }
site = { cmd = "python docs/build_site.py", depends-on = ["gallery"] }
build-conda = { cmd = "pixi publish" }
build-wheel = { cmd = "hatch build" }
stage-artifacts = { cmd = """
rm -rf out
mkdir -p out/conda/noarch out/pypi
cp *.conda out/conda/noarch/
cp dist/*.whl out/pypi/
cp dist/*.tar.gz out/pypi/
""" }
build-artifacts = { depends-on = ["build-conda", "build-wheel", "stage-artifacts"] }

[tool.pixi.package.build.backend]
name = "pixi-build-rattler-build"
version = "*"
channels = [
    "https://prefix.dev/pixi-build-backends",
    "https://prefix.dev/conda-forge",
]

[tool.pixi.package.build.config]
recipe = "recipe/recipe.yaml"
