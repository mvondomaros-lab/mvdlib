[project]
name = "mvdlib"
version = "0.18.0"
authors = [{ name = "Michael von Domaros", email = "mvondomaros@uni-marburg.de" }]
description = "An incubator library with custom Matplotlib styles, utility functions, and experimental tools for future projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.6",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.10.6",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
]
stats = [
    "numba>=0.62",
    "scipy>=1.16.1",
]
diffusion = [
    "numba>=0.62",
    "scipy>=1.16.1",
]
all = [
    "matplotlib>=3.10.6",
    "numba>=0.62",
    "pyedr>=0.8,<0.9",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
]
gromacs = [
    "pyedr>=0.8,<0.9",
]
test = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mvdlib"]
include = ["mvdlib/style/*.mplstyle"]

[tool.hatch.build.targets.sdist]
include = ["mvdlib",
    "README.md",
    "LICENSE"]

[tool.pixi.workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64"]
preview = ["pixi-build"]

[tool.pixi.dependencies]
hatch = "<2"
matplotlib = ">=3.10.6"
numba = ">=0.62"
numpy = ">=2.2.6"
pixi-pycharm = "*"
pyedr = ">=0.8,<0.9"
pytest = ">=8"
scipy = ">=1.16.1"
seaborn = ">=0.13.2"

[tool.pixi.pypi-dependencies]
mvdlib = { path = ".", editable = true }

[tool.pixi.tasks]
build-conda = { cmd = "pixi publish" }
build-wheel = { cmd = "hatch build" }
stage-artifacts = { cmd = """
rm -rf out
mkdir -p out/conda/noarch out/pypi
cp *.conda out/conda/noarch/
cp dist/*.whl out/pypi/
cp dist/*.tar.gz out/pypi/
""" }
build-artifacts = { depends-on = ["build-conda", "build-wheel", "stage-artifacts"] }

[tool.pixi.package.build.backend]
name = "pixi-build-rattler-build"
version = "*"
channels = [
    "https://prefix.dev/pixi-build-backends",
    "https://prefix.dev/conda-forge",
]

[tool.pixi.package.build.config]
recipe = "recipe/recipe.yaml"
