[project]
name = "mvdlib"
version = "0.14"
authors = [{ name = "Michael von Domaros", email = "mvondomaros@uni-marburg.de" }]
description = "An incubator library with custom matplotlib styles, utility functions, and experimental tools for future projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.10"
dependencies = ["numba>=0.65.1,<0.66",
    "numpy",
    "scipy",
    "matplotlib"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mvdlib"]
include = ["mvdlib/style/*.mplstyle"]

[tool.hatch.build.targets.sdist]
include = ["mvdlib",
    "README.md",
    "LICENSE"]

[tool.pixi.workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64"]
preview = ["pixi-build"]

[tool.pixi.dependencies]
hatch = ">=1.17.0,<2"
pytest = ">=9.0.3,<10"
seaborn = ">=0.13.2,<0.14"

[tool.pixi.pypi-dependencies]
mvdlib = { path = ".", editable = true }

[tool.pixi.tasks]
build-conda = { cmd = "pixi publish" }
build-wheel = { cmd = "hatch build" }
stage-artifacts = { cmd = """
rm -rf out
mkdir -p out/conda/noarch out/pypi
cp *.conda out/conda/noarch/
cp dist/*.whl out/pypi/
cp dist/*.tar.gz out/pypi/
""" }
build-artifacts = { depends-on = ["build-conda", "build-wheel", "stage-artifacts"] }

[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = "<=0.5,<0.6"

[tool.pixi.package.build.config]
ignore-pypi-mapping = false
