context:
  version: "0.22.0"

package:
  name: mvdlib
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation

requirements:
  host:
    - hatchling <2
    - pip
    - python >=3.12
  run:
    - python >=3.12
    - matplotlib >=3.10.6
    - numpy >=2.2.6
    - scipy >=1.16.1

tests:
  - python:
      imports:
        - mvdlib
        - mvdlib.plots
        - mvdlib.style
